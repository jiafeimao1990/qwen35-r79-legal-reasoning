[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r79-legal-reasoning"
version = "1.0.0"
description = "Auditable Qwen3.5 legal reasoning with 1949/1978/R79 LoRA routing, MTP3 and an external reasoning graph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jiafeimao1990" }]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
r79-legal = "r79_legal_reasoning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r79_legal_reasoning = ["data/*.sqlite3", "data/*.json", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

